# Build "Tesla Display.app" (universal: Apple Silicon + Intel) แล้วแนบไฟล์ไว้ใน GitHub Release
#
#   ออก release:   git checkout -b release/1.2.0 && git push -u origin release/1.2.0
#                  -> แอปเวอร์ชัน 1.2.0, tag v1.2.0, Release "Tesla Display v1.2.0"
#                  push เพิ่มใน branch เดิม = build ใหม่ + อัปเดตไฟล์ใน Release เดิม (tag ย้ายตาม)
#   ทดสอบ build:   Actions → "Build macOS app" → Run workflow (ได้ไฟล์ใน Artifacts, ไม่สร้าง Release)
name: Build macOS app

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            VERSION="${GITHUB_REF#refs/heads/release/}"
            VERSION="${VERSION#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::branch must be release/<version> e.g. release/1.2.0 (got '${GITHUB_REF#refs/heads/}')"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=Tesla-Display-v$VERSION-macOS.zip" >> "$GITHUB_OUTPUT"
          echo "version: $VERSION"

      - name: Cache mediamtx / Caddy downloads
        uses: actions/cache@v4
        with:
          path: .cache
          key: app-deps-${{ hashFiles('scripts/build-app.sh') }}

      - name: Build universal app
        env:
          UNIVERSAL: "1"
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/build-app.sh

      - name: Verify bundle
        run: |
          APP="build/Tesla Display.app"
          for bin in MacOS/TeslaDisplay Resources/mac-capture Resources/mac-input-agent Resources/mediamtx Resources/caddy; do
            echo "$bin: $(lipo -archs "$APP/Contents/$bin")"
            lipo "$APP/Contents/$bin" -verify_arch arm64 x86_64
          done
          codesign --verify --deep --strict "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"

      - name: Package
        env:
          ZIP: ${{ steps.ver.outputs.zip }}
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent "Tesla Display.app" "$ZIP"
          shasum -a 256 "$ZIP" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.zip }}
          path: |
            build/${{ steps.ver.outputs.zip }}
            build/SHA256SUMS.txt

      - name: Tag + GitHub Release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          ZIP: ${{ steps.ver.outputs.zip }}
        run: |
          # tag v<version> ชี้ไปที่ commit ที่ build (push ซ้ำใน branch เดิม = ย้าย tag ตาม)
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"

          cat > notes.md <<'EOF'
          ## ติดตั้ง Tesla Display (macOS 15+, Apple Silicon และ Intel)

          1. ติดตั้ง ffmpeg: `brew install ffmpeg` (ต้องมี [Homebrew](https://brew.sh))
          2. ดาวน์โหลด **Tesla-Display-…-macOS.zip** ด้านล่าง → แตกไฟล์ → ลาก **Tesla Display.app** ไปไว้ใน **Applications**
          3. แอปไม่ได้ผ่าน notarization ของ Apple — เปิดครั้งแรกให้รันคำสั่งนี้ใน Terminal ก่อน:
             ```bash
             xattr -dr com.apple.quarantine "/Applications/Tesla Display.app"
             ```
             (หรือเปิดแอป 1 ครั้ง แล้วไปที่ System Settings → Privacy & Security → **Open Anyway**)
          4. เปิดแอป → ให้สิทธิ์ **Screen & System Audio Recording** และ **Accessibility** → Quit แล้วเปิดใหม่
          5. ค่าเริ่มต้น: Direct Wi-Fi · Extend · Resolution Auto · 30 fps · 8 Mbps · เสียงเปิด
             — ไม่มี server ก็ใช้ได้ทันที (Mac เปิด Internet Sharing แล้วให้ Tesla ต่อ Wi-Fi ของ Mac)
             — มี server ของตัวเอง: เลือก Route **Home Server** แล้วใส่ Server URL และ Token

          คู่มือเต็ม: [README](../../#readme)
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "build/$ZIP" build/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "build/$ZIP" build/SHA256SUMS.txt \
              --title "Tesla Display $TAG" --notes-file notes.md --verify-tag
          fi
