# ตัวอย่าง nginx (gateway เดิม) แบบมี prefix path: https://home.example.com/tesla/
# ใช้คู่กับ: docker compose -f docker-compose.yml -f compose.behind-proxy.yml up -d --build
#
#   Tesla browser : https://home.example.com/tesla/      (ต้องมี / ท้าย — nginx redirect ให้เองถ้าลืม)
#   แอปบน Mac     : Server = https://home.example.com/tesla
#   .env          : DOMAIN=home.example.com             (โดเมนเดียวกับ server_name, ไม่ใส่ /tesla)
#
# วางบล็อก location ทั้งสองไว้ใน server { } เดิมของโดเมนนี้ใน nginx ได้เลย
# แก้ IP:พอร์ตของเครื่องที่รัน docker แล้ว: nginx -t && nginx -s reload

# WebSocket (/input/) ต้องส่ง header Upgrade ต่อ
# ถ้า nginx config หลักมี map นี้อยู่แล้ว ให้ลบบล็อกนี้ออก (ประกาศซ้ำไม่ได้)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name home.example.com;

    ssl_certificate     /etc/letsencrypt/live/home.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home.example.com/privkey.pem;

    # ... location ของเว็บอื่นๆ ที่มีอยู่แล้ว ...

    location = /tesla {
        return 301 /tesla/;
    }

    location /tesla/ {
        # "/" ท้าย proxy_pass = ตัด /tesla ออกก่อนส่งต่อ (/tesla/screen/whep -> /screen/whep)
        proxy_pass http://192.168.1.50:8088/;               # IP ของเครื่องที่รัน docker : PROXY_PORT
        # mediamtx ตอบ Location: /screen/... -> เติม prefix กลับให้ client
        proxy_redirect / /tesla/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /tesla;
        # WebSocket สำหรับแตะ/พิมพ์/จอย (/tesla/input/)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        client_max_body_size 1m;
    }
}
