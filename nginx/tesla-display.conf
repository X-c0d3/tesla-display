# ตัวอย่าง site ของ nginx (gateway เดิม) สำหรับ Tesla Display
# ใช้คู่กับ: docker compose -f docker-compose.yml -f compose.behind-proxy.yml up -d --build
#
# แก้ 3 จุด: server_name, ใบรับรอง (ssl_certificate*), และ IP:พอร์ตของเครื่องที่รัน docker
# แล้ว: nginx -t && nginx -s reload

# WebSocket (/input/) ต้องส่ง header Upgrade ต่อ
# ถ้า nginx config หลักมี map นี้อยู่แล้ว ให้ลบบล็อกนี้ออก (ประกาศซ้ำไม่ได้)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name screen.example.com;                        # = DOMAIN ใน .env

    ssl_certificate     /etc/letsencrypt/live/screen.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/screen.example.com/privkey.pem;

    location / {
        proxy_pass http://192.168.1.50:8088;               # IP ของ LXC/เครื่องที่รัน docker : PROXY_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket สำหรับแตะ/พิมพ์/จอย (/input/)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # WHIP/WHEP เป็น request เล็กๆ (SDP) ไม่ต้อง buffer
        proxy_buffering off;
        client_max_body_size 1m;
    }
}

server {
    listen 80;
    server_name screen.example.com;
    return 301 https://$host$request_uri;
}
